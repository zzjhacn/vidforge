         background:#0b1220}

             font-size:11px;padding:1px 7px;border-bottom-right-radius:7px}
  .thumb .del{position:absolute;right:2px;top:2px;background:rgba(0,0,0,.6);color:#fff;border:0;

           border-radius:10px;padding:12px;font:14px/1.7 inherit;resize:vertical}

  .row label{width:112px;color:var(--sub);font-size:13px;flex:none}
  input[type=text],input[type=number],select{background:#0b1220;color:var(--ink);border:1px solid var(--line);
      border-radius:8px;padding:8px 10px;font:inherit;flex:1;min-width:0}
  input[type=range]{flex:1;accent-color:var(--cyan)}
  .hint{color:var(--sub);font-size:12px;margin:6px 0 0}
  .check{display:flex;align-items:center;gap:8px}
  .check input{width:auto;accent-color:var(--cyan)}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);
         background:#1c2b45;color:var(--ink);padding:10px 18px;transition:.15s}
  button:hover{border-color:var(--cyan);background:#22334f}

  .actions{display:flex;gap:12px;align-items:center;margin-top:22px;flex-wrap:wrap}
  .bar{height:8px;background:#0b1220;border-radius:6px;overflow:hidden;margin:14px 0 8px;border:1px solid var(--line)}

  .logs{background:#0b1220;border:1px solid var(--line);border-radius:10px;padding:12px;height:170px;overflow:auto;

  .status{font-size:13px;color:var(--sub)}
  .status.err{color:var(--red)} .status.ok{color:var(--green)}
  video{width:100%;border-radius:12px;border:1px solid var(--line);background:#000;margin-top:14px;display:none}
  audio{width:100%;margin-top:10px}
  .tts-test{font-size:13px;padding:8px 14px;width:100%}
  .out{margin-top:18px}
  .pill{display:inline-block;font-size:12px;padding:3px 10px;border-radius:20px;background:rgba(56,189,248,.14);
        color:var(--cyan);margin-left:8px}
</style>

           {id:'sambert-zhiqi-v1',label:'知琪 · 温柔女声'},{id:'sambert-zhijia-v1',label:'知佳 · 标准女声'},
           {id:'sambert-zhiru-v1',label:'知茹 · 新闻女声'},{id:'sambert-zhiqian-v1',label:'知倩 · 资讯女声'},
           {id:'sambert-zhistella-v1',label:'知莎 · 知性女声'},{id:'sambert-zhiting-v1',label:'知婷 · 电台女声'},
           {id:'sambert-zhixiao-v1',label:'知笑 · 资讯女声'},{id:'sambert-zhiwei-v1',label:'知薇 · 萝莉女声'},
           {id:'sambert-zhina-v1',label:'知娜 · 浙普女声'},{id:'sambert-zhiyuan-v1',label:'知媛 · 知心姐姐'},
           {id:'sambert-zhiyue-v1',label:'知悦 · 客服女声'},{id:'sambert-zhigui-v1',label:'知柜 · 直播女声'},
           {id:'sambert-zhimiao-emo-v1',label:'知妙 · 多情感女声'},{id:'sambert-zhishuo-v1',label:'知硕 · 自然男声'},
           {id:'sambert-zhiying-v1',label:'知颖 · 软萌童声'},{id:'sambert-brian-v1',label:'Brian · 美式英语男声'},
           {id:'sambert-betty-v1',label:'Betty · 美式英语女声'}]},
];
const DEFAULT_CANVAS = ['1080x1920','1920x1080','1080x1080'];
let offline = false;
let SCHEMES = DEFAULT_SCHEMES;

// 音色列表归一化：后端 /api/meta 与内置兜底统一为 {id, label, model} 对象；
// 同时兼容历史 [id, label] 元组写法，避免两侧结构漂移导致下拉渲染成 undefined。
// model = 该音色绑定的模型名（openai / bailian 用；其余方案为空）。
function normVoices(list){
  return (list||[]).map(v => {
    const o = Array.isArray(v) ? {id:v[0], label:v[1], model:null} : v;
    return o ? {id:o.id, label:o.label || o.id, model:o.model || ''} : o;
  }).filter(v => v && v.id !== undefined && v.id !== null);
}

// 选中音色后，把该音色绑定的模型名回填到「模型名」输入框
// （openai / bailian 的音色与模型是绑定的，选错模型会直接报错）
function syncModelFromVoice(){
  const opt = $('voice').selectedOptions && $('voice').selectedOptions[0];
  const m = opt ? (opt.getAttribute('data-model') || '') : '';
  if(m) $('ep_model').value = m;
}
$('voice').onchange = syncModelFromVoice;

// 选择方案后：重填音色下拉，并按方案能力显隐语速 / 端点字段
function applyScheme(name){
  const s = SCHEMES.find(x=>x.name===name) || SCHEMES[0];
  const vs = normVoices(s.voices);
  $('voice').innerHTML = vs.length
    ? vs.map(v=>`<option value="${v.id}" data-model="${v.model||''}">${v.label}</option>`).join('')
    : '<option value="">（该方案未提供音色列表，请手填）</option>';
  $('rate_row').style.display = s.supports_rate ? '' : 'none';
  $('ep_block').style.display = s.needs_endpoint ? '' : 'none';
  if(s.name==='bailian'){
    $('sr_row').style.display='';
    $('ep_model_row').style.display='';
    $('ep_sr').value='24000';
    $('ep_url').placeholder='https://';
    $('ep_hint').textContent='百炼端点形如 https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/api/v1/services/audio/tts/SpeechSynthesizer；音色与模型绑定，选中音色会自动回填模型名。';
  } else if(s.name==='openai'){
    $('sr_row').style.display='none';
    $('ep_model_row').style.display='';
    $('ep_url').placeholder='https://';
    $('ep_hint').textContent='OpenAI 兼容端点形如 http://host/v1/audio/speech；音色与模型绑定，选中音色会自动回填模型名。';
  } else if(s.name==='sambert'){
    // Sambert 走 WebSocket：音色即 model，无需填模型名
    $('sr_row').style.display='';
    $('ep_model_row').style.display='none';
    $('ep_sr').value='16000';
    $('ep_url').placeholder='可留空，默认 wss://dashscope.aliyuncs.com/api-ws/v1/inference';
    $('ep_hint').textContent='Sambert 为 WebSocket 实时合成：端点可留空（走官方默认地址），也可填 wss://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/api-ws/v1/inference；音色即模型，无需填模型名。';
  }
  $('ep_model').placeholder = s.name==='bailian' ? 'qwen-audio-3.0-tts-flash' : 'local';
  syncModelFromVoice();   // 切方案后按默认音色回填模型名
  // 换了方案，上一次的试听结果即失效，收起来避免误导
  const au = $('tts_audio');
  if(au.src){ URL.revokeObjectURL(au.src); au.removeAttribute('src'); }
  au.style.display = 'none';
  $('tts_test_msg').textContent = '';
}
$('scheme').onchange = e => applyScheme(e.target.value);

fetch('/api/meta').then(r=>r.json()).then(m=>{
  if(m.schemes && m.schemes.length) SCHEMES = m.schemes;
  $('scheme').innerHTML = SCHEMES.map(s=>`<option value="${s.name}">${s.label}</option>`).join('');
  $('canvas').innerHTML = m.canvas.map(c=>`<option value="${c}">${c}</option>`).join('');
  $('meta').textContent = '多方案 TTS · 零第三方 Web 框架';
  $('tts_test_hint').textContent = '测试句：' + (m.test_text || '（后端未提供）');
  // 默认方案来自配置层（configs/tts_schemes.yaml 的 default_scheme）
  const init = (m.default_scheme && SCHEMES.find(s=>s.name===m.default_scheme)) ? m.default_scheme : 'edge';
  $('scheme').value = init;
  applyScheme(init);
}).catch(()=>{
  offline = true;
  $('scheme').innerHTML = SCHEMES.map(s=>`<option value="${s.name}">${s.label}</option>`).join('');
  $('canvas').innerHTML = DEFAULT_CANVAS.map(c=>`<option value="${c}">${c}</option>`).join('');
  $('meta').textContent = '⚠ 未连接后端，仅供预览';
  $('tts_test_hint').textContent = '未连接后端，试听不可用';
  applyScheme('edge');
  $('go').onclick = () => alert('请先启动服务：vidforge-web\n然后访问 http://127.0.0.1:8765');
});

// 语速滑块联动
$('rate_r').oninput = e => $('rate').value = (e.target.value>0?'+':'') + e.target.value + '%';

// 音色试听：用后端固定短句跑一次当前配置，验证方案/音色/端点/Key 是否可用
$('tts_test').onclick = async () => {
  if(offline){ alert('请先启动服务：vidforge-web\n然后访问 http://127.0.0.1:8765'); return; }
  const btn = $('tts_test'), au = $('tts_audio'), msg = $('tts_test_msg');
  const scheme = $('scheme').value;
  const smeta = SCHEMES.find(x=>x.name===scheme) || {};

  const payload = { scheme, voice: $('voice').value };
  if(smeta.supports_rate) payload.rate = $('rate').value;
  if(smeta.needs_endpoint){
    payload.endpoint = $('ep_url').value.trim();
    payload.key = $('ep_key').value.trim();
    if(scheme !== 'sambert') payload.model = $('ep_model').value.trim();
    if(scheme === 'bailian' || scheme === 'sambert') payload.sample_rate = $('ep_sr').value.trim();
  }

  btn.disabled = true;
  btn.textContent = '合成中…';
  msg.className = 'status';
  msg.textContent = '正在请求 TTS…';
  au.style.display = 'none';

  try{
    const r = await fetch('/api/tts-test', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    if(!r.ok){
      const e = await r.json().catch(()=>({}));
      throw new Error(e.error || ('HTTP ' + r.status));
    }
    const dur = parseFloat(r.headers.get('X-Audio-Duration') || '0');
    const blob = await r.blob();
    if(au.src) URL.revokeObjectURL(au.src);
    au.src = URL.createObjectURL(blob);
    au.style.display = '';
    au.play().catch(()=>{});          // 浏览器可能拦截自动播放，交给用户手动点
    msg.className = 'status ok';
    msg.textContent = dur ? `合成成功 · 实测 ${dur.toFixed(2)} 秒` : '合成成功';
  }catch(err){
    msg.className = 'status err';
    msg.textContent = '试听失败：' + err.message;
  }finally{
    btn.disabled = false;
    btn.textContent = '▶ 试听当前配置';
  }
};

// 上传：点击 + 拖拽
const drop = $('drop');
drop.onclick = () => $('file').click();
$('file').onchange = e => addFiles([...e.target.files]);
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop', e => addFiles([...e.dataTransfer.files]));

function addFiles(list){
  files.push(...list.filter(f=>f.type.startsWith('image/')));
  renderThumbs();
}
function renderThumbs(){
  $('thumbs').innerHTML = files.map((f,i)=>{
    const u = URL.createObjectURL(f);
    return `<div class="thumb"><img src="${u}"><span class="no">${i+1}</span>
            <button class="del" data-i="${i}">×</button></div>`;
  }).join('');
  $('thumbs').querySelectorAll('.del').forEach(b=>b.onclick=()=>{
    files.splice(+b.dataset.i,1); renderThumbs();
  });
}

// 示例文案
$('demo').onclick = () => {
  $('script').value = '今日游泳1500米，留了点时间练习自由泳。数据复盘来了：蛙泳1500米，总时长35分36秒。平均配速2分22秒每100米，最快配速1分58秒，1000米耗时23分11秒，半小时大概游了1280米。总消耗625千卡，平均心率129，划水739次。';
  $('markers').value = '数据复盘来了';
};

// 生成
$('go').onclick = async () => {
  if(!files.length){ alert('请先上传至少一张卡片图'); return; }
  if(!$('script').value.trim()){ alert('文案不能为空'); return; }

  const fd = new FormData();
  files.forEach(f => fd.append('images', f, f.name));
  fd.append('script', $('script').value.trim());
  const scheme = $('scheme').value;
  fd.append('scheme', scheme);
  fd.append('voice', $('voice').value);
  const smeta = (SCHEMES.find(x=>x.name===scheme) || {});
  if(smeta.supports_rate) fd.append('rate', $('rate').value);
  if(smeta.needs_endpoint){
    fd.append('endpoint', $('ep_url').value.trim());
    fd.append('key', $('ep_key').value.trim());
    // sambert 音色即 model，不提交 model，避免与 voice 冲突
    if(scheme!=='sambert') fd.append('model', $('ep_model').value.trim());
    if(scheme==='bailian' || scheme==='sambert') fd.append('sample_rate', $('ep_sr').value.trim());
  }
  fd.append('canvas', $('canvas').value);
  fd.append('fit', $('fit').value);
  fd.append('markers', $('markers').value);
  fd.append('subtitle', $('sub_on').checked ? '1' : '');
  fd.append('subtitle_size', $('sub_size').value);
  fd.append('bottom_margin', $('sub_margin').value);
  fd.append('max_sentence_chars', $('maxchars').value);

  $('go').disabled = true; $('video').style.display='none'; $('dlbox').style.display='none';
  $('logs').textContent=''; $('status').textContent='提交中…'; $('status').className='status';

  const res = await fetch('/api/generate', {method:'POST', body:fd});
  const data = await res.json();
  if(data.error){ alert(data.error); $('go').disabled=false; $('status').textContent='已取消'; return; }
  taskId = data.task_id;
  timer = setInterval(poll, 900);
  poll();
};

async function poll(){
  const t = await (await fetch('/api/task/'+taskId)).json();
  $('bar').style.width = (t.percent||0) + '%';
  $('msg').textContent = t.last_message || '';
  $('logs').textContent = (t.logs||[]).slice(-40).join('\n');
  $('logs').scrollTop = $('logs').scrollHeight;

  if(t.status === 'done'){
    clearInterval(timer); $('go').disabled=false;
    $('status').textContent='✓ 完成'; $('status').className='status ok';
    $('video').src='/api/preview/'+taskId; $('video').style.display='block';
    $('dlbox').style.display='block';
    $('info').textContent = `${t.duration}s · ${t.size_mb}MB · ${t.images} 张图`;
    $('dl').onclick = () => location.href='/api/download/'+taskId;
  } else if(t.status === 'error'){
    clearInterval(timer); $('go').disabled=false;
    $('status').textContent='✗ '+t.error; $('status').className='status err';
  }
}
</script>
